<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#5B3FFF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Gold Coin Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Coin Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Outer Soft Glow / Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#311075" flood-opacity="0.4" />
    </filter>

    <!-- Shiny Highlight -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle with Shadow -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Top Glass Highlight Overlay -->
  <path d="M 12 38 C 12 21.4 25.4 8 42 8 L 86 8 C 102.6 8 116 21.4 116 38 C 80 48 48 48 12 38 Z" fill="url(#shineGrad)" />

  <!-- Outer Border Accent -->
  <rect x="9.5" y="9.5" width="109" height="109" rx="28.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3" />

  <!-- Main Golden Badge / Coin Center -->
  <circle cx="64" cy="65" r="38" fill="url(#goldRim)" />
  <circle cx="64" cy="64" r="34" fill="url(#goldGrad)" />
  <circle cx="64" cy="64" r="30" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="3 3" opacity="0.7" />

  <!-- Bold Playful Letter "F" with Adventure/Game Touch -->
  <!-- 3D extruded shadow for F -->
  <path d="M 47 41 L 78 41 C 82.5 41 85.5 44 85.5 48.5 C 85.5 53 82.5 56 78 56 L 59 56 L 59 62 L 74 62 C 78 62 80.5 64.5 80.5 68.5 C 80.5 72.5 78 75 74 75 L 59 75 L 59 87 C 59 90.5 56.5 93 53 93 C 49.5 93 47 90.5 47 87 Z" fill="#92400E" transform="translate(1.5, 2)" />
  
  <!-- Main F Shape -->
  <path d="M 47 40 L 78 40 C 82.5 40 85.5 43 85.5 47.5 C 85.5 52 82.5 55 78 55 L 59 55 L 59 62 L 74 62 C 78 62 80.5 64.5 80.5 68.5 C 80.5 72.5 78 75 74 75 L 59 75 L 59 87 C 59 90.5 56.5 93 53 93 C 49.5 93 47 90.5 47 87 Z" fill="#FFFFFF" />

  <!-- Sparkle / Star in top-right corner of badge -->
  <path d="M 94 28 Q 94 36 102 36 Q 94 36 94 44 Q 94 36 86 36 Q 94 36 94 28 Z" fill="#FEF08A" />
  <circle cx="94" cy="36" r="2.5" fill="#FFFFFF" />
  
  <!-- Mini Sparkle bottom-left -->
  <path d="M 28 84 Q 28 89 33 89 Q 28 89 28 94 Q 28 89 23 89 Q 28 89 28 84 Z" fill="#93C5FD" opacity="0.8" />
</svg>
